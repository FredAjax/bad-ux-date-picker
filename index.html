<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            justify-items:center;
            height:98vh;
            align-content:center;
            text-align:center;
        }
        #slot-machine{
            position:relative;
            background-color:#ffbb6a;
            border:6px solid #be7d30;
            padding-top:40px;
            height:60vh;
            width:45vw;
            justify-items:center;
            display:flex;
            justify-content:center;
            flex-direction:row;
            border-top-right-radius:10px;
            border-top-left-radius:10px;
            }
        @media only screen and (max-width:768px){
            #slot-machine{
            width:75vw;
        }}
        @media only screen and (min-width:1200px){
            #slot-machine{
            width:500px;
        }}
        #slot-screen{
        border:4px solid black;
        border-radius:10px;
        background-color:#db9847;
        width:250px;
        height:fit-content;
        display:flex;
        flex-direction:row;
        justify-content:space-around;
        padding:30px;
        align-items:center;
        }
        .slot{
        width:50px;
        height:50px;
        border:2px solid black;
        display:flex;
        position:relative;
        align-items:center;
        justify-content:center;
        font-size:24px;
        background-color:white;
        overflow:hidden;
        }
        .slot>p{
        margin:0;
        line-height:0;
        position:absolute;
        font-family: sans-serif;
        }
        .slot>p.number-animate{animation:0.1s spin infinite;}
        .slot:nth-of-type(2)>p{animation-delay:0.025s;}
        .slot:nth-of-type(3)>p{animation-delay:0.05s;}
        .slot:nth-of-type(4)>p{animation-delay:0.075s;}
        #slot-screen>p{
        font-size:24px;
        font-weight:700;
        }
        #slot-lever{
        cursor:pointer;
        position:absolute;
        right:-28px;
        display:flex;
        flex-direction:column;
        align-items:center;
        top:50px;
        }
        .lever-animate{
        animation:2s pull;
        animation-iteration-count:1;
        }
        @keyframes pull{
        50%{
            transform: rotateX(180deg);
            top:240px;
        }
        }
        @keyframes spin{
        0%{
            top:-5px;
            filter:blur(2px)
        }
        100%{
            top:50px;
            filter:blur(2px)
        }
        }
        #ball{
        width:50px;
        height:50px;
        background-color:black;
        border-radius:100%;
        z-index:5;
        }
        #stick{
        margin-top:-10px;
        height:150px;
        width:25px;
        background-color:#e6e6e6;
        border-bottom:5px solid black;
        }
        button{
            font-size:16px;
            font-weight:700;
        }
    </style>
</head>
<body>
    <h2 style="font-family:sans-serif;">Please enter date of birth</h2>
    <h3 style="font-family:sans-serif;"> </h3>
    <button style="margin-bottom:20px;" onclick="finallyDone()">Submit</button>
    <div id="slot-machine">
        <div id="slot-screen">
            <div class="slot"><p>--</p></div>
            <p>/</p>
            <div class="slot"><p>--</p></div>
            <p>/</p>
            <div class="slot"><p>--</p></div>
            <div class="slot"><p>--</p></div>
        </div>
        <div id="slot-lever" onclick="animationRun()">
            <div id="ball"></div>
            <div id="stick"></div>
        </div>
    </div>
<script>
let nrSpins = 0;
function animationRun(){
    nrSpins++;
    document.querySelector("h3").innerText=" ";
    document.getElementById("slot-lever").classList.add("lever-animate");
    numberSpin()
    setTimeout(() => {
        document.getElementById("slot-lever").classList.remove("lever-animate");
    }, "2000");
}

function numberSpin(){
  let maxDays = [31,28,31,30,31,30,31,31,30,31,30,31];
  let monthNr = Math.floor(Math.random()*12)+1;
  let dayNr = Math.floor(Math.random()*maxDays[monthNr-1])+1;
  let yearOne = Math.floor(Math.random()*2)+19;
  let yearTwo;
  if(yearOne == 19){
    yearTwo = Math.floor(Math.random()*99)+1;
  }
  else{
    yearTwo = Math.floor(Math.random()*25)+1;
  }
  if(yearTwo.toString().length == 1){
      yearTwo = "0"+ yearTwo;
    }
  document.querySelectorAll(".slot p")[0].innerText = "--";
  document.querySelectorAll(".slot p")[1].innerText = "--";
  document.querySelectorAll(".slot p")[2].innerText = "--";
  document.querySelectorAll(".slot p")[3].innerText = "--";
  document.querySelectorAll(".slot p")[0].classList.add("number-animate");
  document.querySelectorAll(".slot p")[1].classList.add("number-animate");
  document.querySelectorAll(".slot p")[2].classList.add("number-animate");
  document.querySelectorAll(".slot p")[3].classList.add("number-animate");
  setTimeout(() => {
  document.querySelectorAll(".slot p")[0].classList.remove("number-animate");
    document.querySelectorAll(".slot p")[0].innerText = dayNr;
}, "2000");
  setTimeout(() => {
  document.querySelectorAll(".slot p")[1].classList.remove("number-animate");
    document.querySelectorAll(".slot p")[1].innerText = monthNr;
}, "2400");
  setTimeout(() => {
  document.querySelectorAll(".slot p")[2].classList.remove("number-animate");
    document.querySelectorAll(".slot p")[2].innerText = yearOne;
}, "2800");
  setTimeout(() => {
  document.querySelectorAll(".slot p")[3].classList.remove("number-animate");
    document.querySelectorAll(".slot p")[3].innerText = yearTwo;
}, "3200");
setTimeout(() => {
  document.querySelector("h3").innerText=dayNr+"/"+monthNr+"/"+yearOne+""+yearTwo;
}, "3300");

}
function finallyDone(){
    document.querySelector("h3").innerHTML="Thank you for submitting your date of birth!<br>You did it in only "+nrSpins+" spin(s)!"
    document.querySelector("h2").style="display:none;";
    document.getElementById("slot-machine").style="display:none;";
    document.querySelector("button").style="display:none;";
}
</script>
</body>
</html>
